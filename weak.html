<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weak Keys — TypeFlow</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="main" class="wrap section" style="padding-top:36px">
    <p class="kicker">Targeted practice</p>
    <h1 class="section-h">Practice my weak keys</h1>
    <p class="section-p">TypeFlow builds drills from the keys you miss most. Fix the weak links, raise the whole skill.</p>
    <div class="card">
      <h3>Your weakest keys</h3>
      <ul id="list"></ul>
      <button class="btn btn-primary" id="start" type="button">Practice these keys</button>
    </div>
    <section id="live" hidden style="margin-top:22px">
      <div class="prompt" id="prompt"></div>
      <div class="kb-wrap" style="margin-top:16px"><div id="kb"></div></div>
    </section>
  </main>
  <script type="module" src="js/weak.js"></script>
</body>
</html>
